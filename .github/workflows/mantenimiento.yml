name: Purgar previsualizaciones caducadas
on:
  workflow_dispatch:
  schedule:
    # 03:17 America/Lima (UTC-5). GitHub puede retrasar tareas programadas.
    - cron: '17 8 * * *'
permissions:
  contents: read
concurrency:
  group: purgar-previsualizaciones-produccion
  cancel-in-progress: false
jobs:
  purgar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - run: python -m pip install -r requirements.txt
      - name: Purgar solo temporales de más de 24 horas
        run: |
          python - <<'PY'
          import os
          import secrets
          if not os.environ.get('DATABASE_URL'):
              raise SystemExit('Configure el secreto NEON_DATABASE_URL.')
          os.environ.update(
              DJANGO_SETTINGS_MODULE='config.settings', DEBUG='False',
              SECRET_KEY=secrets.token_urlsafe(64), ALLOWED_HOSTS='localhost',
              CSRF_TRUSTED_ORIGINS='https://localhost',
          )
          try:
              import django
              django.setup()
              from django.core.management import call_command
              call_command('migrate', check_unapplied=True, verbosity=0)
              call_command('purgar_previsualizaciones')
          except Exception:
              raise SystemExit('Purga fallida. Revisar conexión TLS, permisos y migraciones desde una terminal protegida. No se muestran datos ni credenciales.') from None
          PY
